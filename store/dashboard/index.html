<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoloMarket Dashboard</title><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><a class="logo" href="../index.html">SoloMarket</a><nav><a href="../index.html">Marketplace</a><a href="#products">Products</a><a href="#orders">Orders</a></nav><button class="secondary" id="logout">Log out</button></header><main class="section"><label>CREATOR DASHBOARD</label><h1>Welcome, creator.</h1><div class="sellbox"><div><h2>Launch your first <i>product.</i></h2><p>Add a digital product to your storefront. Product creation UI is ready for the next connection pass.</p><button class="primary big" id="add">＋ Add product</button></div><div class="sellstats"><b>0<small>products</small></b><b>$0<small>revenue</small></b><b>0<small>orders</small></b></div></div><h2 id="products">Your products</h2><div class="grid"><div class="product"><div class="art">＋</div><div class="info"><b>Add your first product</b></div></div></div></main><script src="../js/config.js"></script><script>const c=window.SOLO_CONFIG;const sb=(window.supabase&&c.key&&!c.key.startsWith("YOUR_"))?window.supabase.createClient(c.url,c.key):null;document.querySelector("#logout").onclick=async()=>{if(sb)await sb.auth.signOut();location.href="../index.html"};document.querySelector("#add").onclick=()=>alert("Product creation will be connected to Supabase Storage in the next pass.");</script></body></html>
